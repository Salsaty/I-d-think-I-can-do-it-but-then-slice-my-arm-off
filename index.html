
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strategic Personal Development</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #f3f5f8;
        color: #202b3c;
        font-family: Arial, sans-serif;
    }

    header {
        background: #14243a;
        color: white;
        padding: 24px 8%;
        font-size: 19px;
        font-weight: bold;
        letter-spacing: 1px;
    }

    main {
        max-width: 850px;
        margin: 100px auto;
        padding: 55px 40px;
        background: white;
        border: 1px solid #e0e5ec;
        border-radius: 8px;
        box-shadow: 0 8px 30px rgba(0,0,0,.04);
        text-align: center;
    }

    .label {
        color: #64748b;
        text-transform: uppercase;
        font-size: 12px;
        letter-spacing: 2px;
    }

    h1 {
        font-size: 36px;
        line-height: 1.4;
        margin: 30px 0;
    }

    .line {
        width: 55px;
        height: 3px;
        background: #315c91;
        margin: 25px auto;
    }

    footer {
        text-align: center;
        color: #8993a1;
        font-size: 12px;
        padding: 30px;
    }
</style>
</head>

<body>

<header>
    CORPORATE DEVELOPMENT GROUP
</header>

<main>
    <div class="label">Official Strategic Statement</div>

    <div class="line"></div>

    <h1>I'd think I can do it but then slice my arm off</h1>

    <div class="line"></div>

    <div class="label">Internal Motivation & Risk Assessment</div>
</main>

<footer>
    © 2026 Corporate Development Group. All rights reserved.
</footer>

</body>
</html>
